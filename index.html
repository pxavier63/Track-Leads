<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline Comercial Ativo</title>
  
  <!-- Biblioteca para leitura e tratamento robusto do CSV do Google Sheets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
      overflow-x: hidden;
    }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #1e293b;
      padding-bottom: 12px;
    }

    h1 {
      font-size: 1.6rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 0;
      color: #38bdf8;
    }

    #sync-status {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    #table-container {
      width: 100%;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: #1e293b;
      padding: 14px 12px;
      font-size: 0.85rem;
      color: #94a3b8;
      text-transform: uppercase;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 2px solid #334155;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #1e293b;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    tr:nth-child(even) {
      background: rgba(30, 41, 59, 0.4);
    }

    /* Badges de Status dinâmicos */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
    }
    .badge-default { background: #475569; color: #f8fafc; }
    .badge-offer, .badge-proposta { background: #d97706; color: #fff; }
    .badge-po, .badge-encomenda { background: #16a34a; color: #fff; }
    .badge-invoiced, .badge-faturado { background: #0284c7; color: #fff; }
    .badge-qualified, .badge-qualificado { background: #6366f1; color: #fff; }
  </style>
</head>
<body>

  <header>
    <h1>Pipeline Comercial Ativo</h1>
    <div id="sync-status">A carregar dados...</div>
  </header>

  <div id="table-container">
    <table id="leads-table">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Criado</th>
          <th>Qualificado</th>
          <th>Comercial</th>
          <th>Status</th>
          <th>Proposta</th>
          <th>Encomenda</th>
          <th>Fatura</th>
          <th>Notas/Follow-up</th>
        </tr>
      </thead>
      <tbody id="leads-body"></tbody>
    </table>
  </div>  

  <script>
    // Substitua pelo URL da sua folha Google Sheets publicada em formato CSV
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSudRa9lfRkYRdH_K157AUFJbmRtPlNHbB3n5KXbI5G8wUabQqW9qKg9wxMqfxMYJc-8ZU2kxuBXIsD/pub?gid=268564624&single=true&output=csv";

    async function loadData() {
      try {
        // Prevenção de cache do browser/Google
        const fetchUrl = `${GOOGLE_SHEET_CSV_URL}&_t=${new Date().getTime()}`;
        const response = await fetch(fetchUrl);
        
        if (!response.ok) {
          throw new Error("HTTP error " + response.status);
        }

        const csvText = await response.text();

        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            renderTable(results.data);
            const now = new Date();
            document.getElementById("sync-status").innerText = 
              `Atualizado às: ${now.toLocaleTimeString()}`;
          }
        });
      } catch (err) {
        console.error("Erro ao carregar dados do Google Sheets:", err);
        document.getElementById("sync-status").innerText = "Erro na sincronização.";
      }
    }

    function renderTable(rows) {
      const tbody = document.getElementById("leads-body");
      
      tbody.innerHTML = rows.map(r => {
        // Aceita tanto cabeçalhos em português como em inglês
        const nome = r["Nome"] || r["Lead Name"] || "-";
        const criado = r["Criado"] || r["Creation Date"] || "-";
        const qualificado = r["Qualificado"] || r["Qualification Date"] || "-";
        const comercial = r["Comercial"] || r["Commercial Assigned"] || "-";
        const status = r["Status"] || "-";
        const proposta = r["Proposta"] || r["Offer Date"] || "-";
        const encomenda = r["Encomenda"] || r["PO Date"] || "-";
        const fatura = r["Fatura"] || r["Invoice Date"] || "-";
        const notas = r["Notas/Follow-up"] || r["Notes / Next Steps"] || "-";

        const statusClass = status.toLowerCase().replace(/[^a-z0-9]/g, '');

        return `<tr>
          <td><strong>${nome}</strong></td>
          <td>${criado}</td>
          <td>${qualificado}</td>
          <td>${comercial}</td>
          <td><span class="badge badge-${statusClass} badge-default">${status}</span></td>
          <td>${proposta}</td>
          <td>${encomenda}</td>
          <td>${fatura}</td>
          <td style="white-space: normal; min-width: 200px;">${notas}</td>
        </tr>`;
      }).join("");
    }

    // Auto-scroll contínuo para o monitor de escritório
    let pos = 0;
    let isPaused = false;

    function autoScroll() {
      if (isPaused) return;

      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      if (maxScroll <= 0) return;

      pos += 1;
      if (pos >= maxScroll) {
        isPaused = true;
        setTimeout(() => {
          window.scrollTo({ top: 0, behavior: "smooth" });
          pos = 0;
          setTimeout(() => { isPaused = false; }, 1000);
        }, 4000); // Pausa de 4 segundos no fundo da lista
      } else {
        window.scrollTo(0, pos);
      }
    }

    // Execuções periódicas
    loadData();
    setInterval(loadData, 60000); // Atualiza os dados a cada 60s
    setInterval(autoScroll, 40);   // Movimento de scroll suave a ~25fps
  </script>
</body>
</html>
