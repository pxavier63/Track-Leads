<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Track Leads</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    h1 { font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 16px; color: #38bdf8; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #1e293b; padding: 12px; font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; position: sticky; top: 0; }
    td { padding: 12px; border-bottom: 1px solid #334155; font-size: 0.95rem; }
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
    .badge-offer { background: #ca8a04; color: #fff; }
    .badge-po { background: #16a34a; color: #fff; }
  </style>
</head>
<body>
  <h1>Active Commercial Pipeline</h1>
  <div id="table-container">
    <table id="leads-table">
      <thead>
        <tr>
          <th>Nome</th><th>Crriado</th><th>Qualificado</th><th>Comercial</th><th>Status</th>
          <th>Proposta</th><th>Encomenda</th><th>Fatura</th>
          <th>Notes / Follow-up</th>
        </tr>
      </thead>
      <tbody id="leads-body"></tbody>
    </table>
  </div>
  <script>
    const CSV_URL = "LeadsDashboard.csv";
    async function loadData() {
      const res = await fetch(CSV_URL);
      const text = await res.text();
      const rows = text.trim().split("\n").slice(1);
      const tbody = document.getElementById("leads-body");
      tbody.innerHTML = rows.map(r => {
        const c = r.split(",");
        return `<tr>
          <td><strong>${c[0]}</strong></td><td>${c[1]}</td><td>${c[2]}</td>
          <td>${c[3]}</td><td><span class="badge">${c[4]}</span></td>
          <td>${c[5]}</td><td>${c[6]}</td><td>${c[7]}</td>
        </tr>`;
      }).join("");
    }

    // Auto-scroll logic
    let pos = 0;
    function autoScroll() {
      pos += 1;
      if (pos >= document.body.scrollHeight - window.innerHeight) {
        setTimeout(() => { pos = 0; window.scrollTo(0, 0); }, 4000);
      } else {
        window.scrollTo(0, pos);
      }
    }

    loadData();
    setInterval(loadData, 60000);   // Refresh data every 60s
    setInterval(autoScroll, 40);     // 25fps smooth rolling
  </script>
</body>
</html>
